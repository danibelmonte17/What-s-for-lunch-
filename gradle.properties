# JDK 17 para el build. AGP 8.13.2 no arranca con el JBR de Android Studio (en esta
# máquina, JDK 25) y los scripts del harness seleccionan ese JBR cuando JAVA_HOME no
# está definido; fijamos aquí el JDK 17 para que el daemon de Gradle lo use siempre.
org.gradle.java.home=C:/Users/Daniel/.jdks/corretto-17.0.20
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
